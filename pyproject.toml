[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagecheck"
version = "0.1.0"
description = "Checks casual and part-time payslips against Australian Modern Awards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Santhosh Ramachandran" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "pymupdf>=1.24",
]

[project.scripts]
wagecheck = "wagecheck.cli:main"

[project.optional-dependencies]
synth = ["reportlab>=4", "pillow>=10", "numpy>=1.26"]
dev = ["wagecheck[synth]", "pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-reportlab"]

[tool.hatch.build.targets.wheel]
packages = ["src/wagecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
