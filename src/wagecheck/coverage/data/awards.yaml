  - code: MA000028
    title: Horticulture Award 2020
    industry: [farm, orchard, vineyard, horticulture, nursery, market garden, berry farm, packing shed]
    occupation: [fruit picker, picker, farm hand, harvest worker, pruner, packer, horticultural worker]
